[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kk-memorize-vocabulary"
version = "1.0.0"
description = "A small offline vocabulary notebook for Windows"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6"]

[project.scripts]
kk-vocabulary = "vocabulary.app:main"

[tool.setuptools.packages.find]
include = ["vocabulary*"]

[tool.setuptools.package-data]
vocabulary = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

